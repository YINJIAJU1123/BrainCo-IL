schema_version: 1
train_config:
  __class__: openpi.training.config.TrainConfig
  fields:
    name: "0715_pi05_28D_merged_right28"
    project_name: imitation
    exp_name: "0715_pi05_28D_merged_right28_lora_action28_lr5e5"
    model:
      __class__: openpi.models.pi0_config.Pi0Config
      fields:
        pi05: true
        action_dim: 28
        action_horizon: 16
        max_token_len: 256
        dtype: bfloat16
        paligemma_variant: gemma_2b_lora
        action_expert_variant: gemma_300m_lora
        discrete_state_input: true
    weight_loader:
      __class__: openpi.training.weight_loaders.PartialCheckpointWeightLoader
      fields:
        params_path: gs://openpi-assets/checkpoints/pi05_base/params
        skip_on_mismatch_regex: .*(action_in_proj|action_out_proj|state_proj).*
    lr_schedule:
      __class__: openpi.training.optimizer.CosineDecaySchedule
      fields:
        warmup_steps: 1000
        peak_lr: 5.0e-05
        decay_steps: 40000
        decay_lr: 5.0e-06
    optimizer:
      __class__: openpi.training.optimizer.AdamW
      fields:
        b1: 0.9
        b2: 0.95
        eps: 1.0e-08
        weight_decay: 1.0e-10
        clip_gradient_norm: 1.0
    ema_decay: null
    freeze_strategy: lora_and_action_interface
    data:
      __class__: openpi.training.config.LeRobotBrainCoDataConfig
      fields:
        repo_id: brainco_0713_merged_right28
        assets:
          __class__: openpi.training.config.AssetsConfig
          fields:
            assets_dir: ./assets/pi05_brainco_right28
            asset_id: brainco_0713_merged_right28
        base_config:
          __class__: openpi.training.config.DataConfig
          fields:
            prompt_from_task: true
            lerobot_datasets:
              - __class__: openpi.training.config.LeRobotDataset
                fields:
                  repo_id: /mnt/workspace/dataset/revotron_mit_revo3_mit_3cam_pick_and_place_0713_merged_right28
                  weight: 1.0
                  asset_id: null
            multi_dataset_mode: concat
        extra_delta_transform: true
        policy_io:
          __class__: openpi.policies.brainco_policy.BrainCoPolicyIOConfig
          fields:
            state_groups: [right_arm, right_hand]
            action_groups: [right_arm, right_hand]
            delta_action_groups: [right_arm]
            dataset_state_dim: 28
            dataset_state_indices: null
        arm_dof: 7
        hand_dof: 21
        head_camera_key: observation.images.cam_head
        revo3_eef_joint_hand_to_joint_hand: false
        action_sequence_keys:
          - action
    assets_base_dir: ./assets
    checkpoint_base_dir: ./checkpoints
    seed: 42
    batch_size: 16
    num_workers: 8
    num_train_steps: 40000
    log_interval: 10
    save_interval: 4000
    keep_period: 4000
    save_final_checkpoint: true
    overwrite: false
    resume: false
    wandb_enabled: true
    policy_metadata: null
    fsdp_devices: 1
