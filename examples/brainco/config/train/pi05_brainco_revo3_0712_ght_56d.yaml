schema_version: 1
train_config:
  __class__: openpi.training.config.TrainConfig
  fields:
    name: pi05_brainco_revo3_0712_ght_56d
    project_name: imitation
    exp_name: pi05_brainco_revo3_0712_ght_56d
    model:
      __class__: openpi.models.pi0_config.Pi0Config
      fields:
        action_dim: 56
        action_horizon: 16
        max_token_len: 256
        dtype: bfloat16
        paligemma_variant: gemma_2b
        action_expert_variant: gemma_300m
        pi05: true
        discrete_state_input: true
    weight_loader:
      __class__: openpi.training.weight_loaders.PartialCheckpointWeightLoader
