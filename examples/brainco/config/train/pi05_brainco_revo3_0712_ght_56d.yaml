        action_sequence_keys:
          - action
    assets_base_dir: ./assets
    checkpoint_base_dir: ./checkpoints
    seed: 42
    batch_size: 16
    num_workers: 8
    num_train_steps: 40000
    log_interval: 10
    save_interval: 4000
    keep_period: 4000
    save_final_checkpoint: true
    overwrite: false
    resume: false
    wandb_enabled: true
    policy_metadata: null
    fsdp_devices: 1
