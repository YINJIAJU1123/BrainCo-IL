        warmup_steps: 1000
        peak_lr: 5.0e-05
        decay_steps: 40000
        decay_lr: 5.0e-06
    optimizer:
      __class__: openpi.training.optimizer.AdamW
      fields:
        b1: 0.9
        b2: 0.95
        eps: 1.0e-08
        weight_decay: 1.0e-10
        clip_gradient_norm: 1.0
    ema_decay: null
    freeze_strategy: none
    data:
      __class__: openpi.training.config.LeRobotBrainCoDataConfig
      fields:
        repo_id: brainco_revo3_0712_ght_56d
        assets:
          __class__: openpi.training.config.AssetsConfig
          fields:
            assets_dir: null
            asset_id: null
        base_config:
          __class__: openpi.training.config.DataConfig
          fields:
            repo_id: null
            asset_id: null
            norm_stats: null
            repack_transforms:
              __class__: openpi.transforms.Group
              fields:
                inputs: []
                outputs: []
            data_transforms:
              __class__: openpi.transforms.Group
              fields:
                inputs: []
                outputs: []
            model_transforms:
              __class__: openpi.transforms.Group
              fields:
                inputs: []
                outputs: []
            use_quantile_norm: false
            action_sequence_keys:
              - actions
            prompt_from_task: true
            rlds_data_dir: null
            action_space: null
            datasets: []
            lerobot_datasets:
              - __class__: openpi.training.config.LeRobotDataset
                fields:
                  repo_id: /mnt/data_nas/dataset/revotron_mit_revo3_mit_3cam_ght_7_12_18_20
                  weight: 1.0
                  asset_id: null
            multi_dataset_mode: concat
        extra_delta_transform: true
        arm_dof: 7
        hand_dof: 21
